services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [back]

  backend:
    build: ./backend
    image: quiz-backend:dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY manquante (le backend plante sans)}
      FROM_EMAIL: ${FROM_EMAIL}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD manquant}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant}
    depends_on:
      db:
        condition: service_healthy
    networks: [front, back]

  frontend:
    build: .
    image: quiz-frontend:dev
    restart: unless-stopped
    ports:
      - "8087:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [front]

volumes:
  pgdata:

networks:
  front:
  back: