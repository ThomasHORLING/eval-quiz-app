
name: Quiz App CI/CD

on:
  # CI sur les Pull Requests vers main
  pull_request:
    branches:
      - main

  # CI sur les branches et CD après push dans main
  push:
    branches:
      - "**"

  # Permet de lancer la pipeline manuellement
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:

  # ==========================================
  # J6-A : INTEGRATION CONTINUE
  # ==========================================
  ci:
    name: Build and Trivy
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Construction de l'image backend
        run: |
          docker build --platform linux/amd64 \
            -t quiz-backend:${{ github.sha }} \
            ./backend

      - name: Scan Trivy du backend
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest \
            image --exit-code 1 \
            --severity CRITICAL \
            quiz-backend:${{ github.sha }}

      - name: Construction de l'image frontend
        run: |
          docker build --platform linux/amd64 \
            -t quiz-frontend:${{ github.sha }} \
            .

      - name: Scan Trivy du frontend
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest \
            image --exit-code 1 \
            --severity CRITICAL \
            quiz-frontend:${{ github.sha }}

  # ==========================================
  # J6-B : DEPLOIEMENT CONTINU
  # ==========================================
  cd:
    name: Deploy to Azure
    runs-on: ubuntu-latest

    needs: ci

    # Déploiement uniquement après une fusion
    # ou un push direct dans main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      # Connexion Azure avec OpenID Connect
      - name: Connexion à Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Récupération des informations ACR
        id: acr
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: |
          ACR_SERVER=$(az acr show \
            --name "$ACR_NAME" \
            --query loginServer -o tsv)

          echo "server=$ACR_SERVER" >> "$GITHUB_OUTPUT"

      - name: Connexion à ACR
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: |
          az acr login --name "$ACR_NAME"

      # Construction et scan avant publication
      - name: Build et scan backend
        env:
          ACR_SERVER: ${{ steps.acr.outputs.server }}
        run: |
          docker build --platform linux/amd64 \
            -t "$ACR_SERVER/quiz-backend:${{ github.sha }}" \
            ./backend

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest \
            image --exit-code 1 \
            --severity CRITICAL \
            "$ACR_SERVER/quiz-backend:${{ github.sha }}"

      - name: Build et scan frontend
        env:
          ACR_SERVER: ${{ steps.acr.outputs.server }}
        run: |
          docker build --platform linux/amd64 \
            -t "$ACR_SERVER/quiz-frontend:${{ github.sha }}" \
            .

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest \
            image --exit-code 1 \
            --severity CRITICAL \
            "$ACR_SERVER/quiz-frontend:${{ github.sha }}"

      # Publication dans Azure Container Registry
      - name: Publication des images dans ACR
        env:
          ACR_SERVER: ${{ steps.acr.outputs.server }}
        run: |
          docker push "$ACR_SERVER/quiz-backend:${{ github.sha }}"
          docker push "$ACR_SERVER/quiz-frontend:${{ github.sha }}"

      # Mise à jour des applications Azure
      - name: Déploiement du backend
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          BACKEND_APP: ${{ vars.BACKEND_APP }}
          ACR_SERVER: ${{ steps.acr.outputs.server }}
        run: |
          az containerapp update \
            --name "$BACKEND_APP" \
            --resource-group "$RG" \
            --image "$ACR_SERVER/quiz-backend:${{ github.sha }}"

      - name: Déploiement du frontend
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          FRONTEND_APP: ${{ vars.FRONTEND_APP }}
          ACR_SERVER: ${{ steps.acr.outputs.server }}
        run: |
          az containerapp update \
            --name "$FRONTEND_APP" \
            --resource-group "$RG" \
            --image "$ACR_SERVER/quiz-frontend:${{ github.sha }}" \
            --set-env-vars "BACKEND_UPSTREAM=quiz-backend"

      # Vérification des révisions
      - name: Vérification des révisions Azure
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          for APP in quiz-backend quiz-frontend; do
            echo "Révisions de $APP"

            az containerapp revision list \
              --name "$APP" \
              --resource-group "$RG" \
              --query "[].{revision:name, actif:properties.active, image:properties.template.containers[0].image}" \
              -o table
          done
