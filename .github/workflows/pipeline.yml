
name: Quiz App CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    name: Build and Trivy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            -t quiz-backend:${{ github.sha }} \
            ./backend

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: quiz-backend:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL

      - name: Build frontend image
        run: |
          docker build \
            -t quiz-frontend:${{ github.sha }} \
            .

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: quiz-frontend:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL

  cd:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get ACR server
        id: acr
        run: |
          ACR_SERVER=$(az acr show \
            --name "${{ vars.ACR_NAME }}" \
            --query loginServer \
            --output tsv)
          echo "server=$ACR_SERVER" >> "$GITHUB_OUTPUT"

      - name: Login to ACR
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Build and push backend image
        run: |
          docker build \
            -t ${{ steps.acr.outputs.server }}/quiz-backend:${{ github.sha }} \
            ./backend

          docker push \
            ${{ steps.acr.outputs.server }}/quiz-backend:${{ github.sha }}

      - name: Build and push frontend image
        run: |
          docker build \
            -t ${{ steps.acr.outputs.server }}/quiz-frontend:${{ github.sha }} \
            .

          docker push \
            ${{ steps.acr.outputs.server }}/quiz-frontend:${{ github.sha }}

      - name: Update backend Container App
        run: |
          az containerapp update \
            --name "${{ vars.BACKEND_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ steps.acr.outputs.server }}/quiz-backend:${{ github.sha }}"

      - name: Update frontend Container App
        run: |
          az containerapp update \
            --name "${{ vars.FRONTEND_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ steps.acr.outputs.server }}/quiz-frontend:${{ github.sha }}" \
            --set-env-vars BACKEND_UPSTREAM=quiz-backend

      - name: List deployed revisions
        run: |
          az containerapp revision list \
            --name "${{ vars.BACKEND_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --output table

          az containerapp revision list \
            --name "${{ vars.FRONTEND_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --output table
